<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicVault - Read Webcomics</title>
  <meta name="description" content="Read webcomics the way their creators intended: vertical scroll, manga, or western page-turns.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Shared header ===== -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo"><span class="logo-mark">CV</span>ComicVault</a>
      <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
      <nav class="site-nav" id="site-nav">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="browse.html">Browse</a></li>
          <li><a href="upload.html">Publish</a></li>
          <li><div id="nav-user-container"></div></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- Search (sends to browse.html?q=...) -->
    <form id="home-search-form" class="home-search" role="search">
      <input type="search" id="home-search-input" class="input-field" placeholder="Search comics by title..." aria-label="Search comics">
      <button type="submit" class="btn">Search</button>
    </form>

    <!-- Featured comic (filled by index.js) -->
    <section class="hero">
      <div class="hero-card" id="hero-card">
        <div class="hero-text">
          <div class="skeleton-line" style="width: 90px;"></div>
          <div class="skeleton-line" style="width: 50%; height: 2.4rem;"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
    </section>

    <!-- Latest chapter updates (filled by index.js) -->
    <section class="updates">
      <div class="section-heading-row">
        <h2 class="section-heading">Latest Updates</h2>
        <a href="browse.html" class="see-all">Browse all &rarr;</a>
      </div>
      <div class="comic-grid" id="latest-grid"></div>
    </section>

  </main>

  <!-- ===== Shared footer ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 ComicVault. Built for webcomic creators and readers.</p>
      <nav><a href="browse.html">Browse</a><a href="upload.html">Publish</a></nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="index.js"></script>
</body>
</html>
