<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Comic-Vault</title>
  <meta name="description" content="Create a free Comic-Vault account to publish your webcomics.">
  <meta name="theme-color" content="#101114">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Comic-Vault">
  <meta property="og:site_name" content="Comic-Vault">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Join Comic-Vault">
  <meta property="og:description" content="Create a free account and publish your webcomic, read the way you intended.">
  <meta property="og:image" content="https://comic-vault.pages.dev/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="common.js"></script>

  <main id="main" class="auth-container" tabindex="-1">
    <div class="auth-card">

      <nav class="auth-tabs" aria-label="Account">
        <a href="login.html" class="tab-btn" data-auth-link>Log In</a>
        <a href="signup.html" class="tab-btn active" data-auth-link aria-current="page">Sign Up</a>
      </nav>

      <form id="signup-form" class="auth-form">
        <h1>Create an account</h1>
        <p class="auth-subtitle">Join Comic-Vault to publish your own series.</p>

        <div class="form-group">
          <label for="signup-username">Username / creator name</label>
          <input type="text" id="signup-username" class="input-field" placeholder="e.g. AlexVance" autocomplete="username" minlength="3" maxlength="30" required>
        </div>

        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" class="input-field" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="input-field" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
        </div>

        <button type="submit" id="signup-btn" class="btn btn-full btn-large">Create Account</button>
        <p id="signup-message" class="auth-message" role="status"></p>
        <p class="auth-switch">Already have an account? <a href="login.html" data-auth-link>Log in</a></p>
        <p class="auth-switch">By signing up you agree to the <a href="terms.html">terms &amp; rules</a>.</p>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="login.js"></script>
</body>
</html>
