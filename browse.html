<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Webcomics - Comic-Vault</title>
  <meta name="description" content="Browse and search webcomics on Comic-Vault.">
  <meta name="theme-color" content="#101114">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Comic-Vault">
  <meta property="og:site_name" content="Comic-Vault">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Browse Webcomics - Comic-Vault">
  <meta property="og:description" content="Browse and search webcomics on Comic-Vault.">
  <meta property="og:image" content="https://comic-vault.pages.dev/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="common.js"></script>

  <main id="main" class="container" tabindex="-1">
    <section class="page-header">
      <h1>Browse comics</h1>
      <p>Search by title, author or story.</p>
    </section>

    <!-- Search & filters (browse.js) -->
    <section class="filter-section" aria-label="Search and filters">
      <form class="filter-bar" role="search" id="filter-form">
        <div class="filter-search">
          <label for="search-input" class="visually-hidden">Search by title, author or story</label>
          <span class="search-icon" data-icon="search"></span>
          <input type="search" id="search-input" class="input-field" placeholder="Search titles, authors or stories…" autocomplete="off">
        </div>

        <button type="button" class="btn btn-secondary filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filter-panel">
          <span data-icon="filter"></span> Filters <span class="filter-count" id="filter-count" hidden></span>
        </button>

        <div class="filter-panel" id="filter-panel">
          <label for="format-select" class="visually-hidden">Reading direction</label>
          <select id="format-select" class="select-field">
            <option value="">All directions</option>
            <option value="infinite">Vertical scroll</option>
            <option value="rtl">Right to left</option>
            <option value="ltr">Left to right</option>
          </select>

          <label for="sort-select" class="visually-hidden">Sort order</label>
          <select id="sort-select" class="select-field">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">Title A–Z</option>
            <option value="za">Title Z–A</option>
          </select>
        </div>

        <div class="view-toggle" role="group" aria-label="Layout">
          <button type="button" data-view="grid" aria-pressed="true" aria-label="Grid view" title="Grid view"><span data-icon="grid"></span></button>
          <button type="button" data-view="list" aria-pressed="false" aria-label="List view" title="List view"><span data-icon="list"></span></button>
        </div>
      </form>

      <div class="chip-row" id="genre-chips" role="group" aria-label="Genre"></div>

      <div class="results-row">
        <p id="results-info" class="results-info" aria-live="polite"></p>
        <div class="results-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="clear-filters" hidden>Clear filters</button>
          <button type="button" class="btn btn-secondary btn-sm" id="random-btn"><span data-icon="shuffle"></span> Surprise me</button>
        </div>
      </div>
    </section>

    <!-- Results (browse.js) -->
    <section class="comic-grid" id="browse-grid" aria-label="Comics"></section>

    <nav class="pagination" id="pagination" aria-label="Pages of results"></nav>
    <div class="load-more-wrap" id="load-more" hidden>
      <span id="load-more-info"></span>
      <button type="button" class="btn btn-secondary" id="load-more-btn">Load more</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="browse.js"></script>
</body>
</html>
