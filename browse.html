<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Webcomics - ComicVault</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== Shared header ===== -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo"><span class="logo-mark">CV</span>ComicVault</a>
      <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
      <nav class="site-nav" id="site-nav">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="browse.html">Browse</a></li>
          <li><a href="upload.html">Publish</a></li>
          <li><div id="nav-user-container"></div></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>Browse Comics</h1>
      <p>Search by title, or filter by genre and reading direction.</p>
    </section>

    <!-- Search & filters (handled by browse.js) -->
    <section class="filter-section">
      <form class="filter-form" role="search" onsubmit="event.preventDefault();">
        <div class="filter-group filter-group-search">
          <input type="search" id="search-input" placeholder="Search comics by title..." class="input-field" aria-label="Search comics by title">
        </div>

        <div class="filter-group">
          <select id="genre-select" class="select-field" aria-label="Genre">
            <option value="">All Genres</option>
            <option value="action">Action</option>
            <option value="fantasy">Fantasy</option>
            <option value="romance">Romance</option>
            <option value="scifi">Sci-Fi</option>
            <option value="slice-of-life">Slice of Life</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="format-select" class="select-field" aria-label="Reading format">
            <option value="">All Formats</option>
            <option value="infinite">Vertical Scroll</option>
            <option value="rtl">Manga (Right to Left)</option>
            <option value="ltr">Western (Left to Right)</option>
          </select>
        </div>

        <div class="filter-group">
          <select id="sort-select" class="select-field" aria-label="Sort order">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="az">Title A-Z</option>
            <option value="za">Title Z-A</option>
          </select>
        </div>
      </form>
      <p id="results-info" class="results-info" aria-live="polite"></p>
    </section>

    <!-- Comic grid (filled by browse.js) -->
    <section class="comic-grid" id="browse-grid"></section>

    <!-- Pagination (filled by browse.js) -->
    <nav class="pagination" id="pagination" aria-label="Page navigation"></nav>
  </main>

  <!-- ===== Shared footer ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 ComicVault. Built for webcomic creators and readers.</p>
      <nav><a href="browse.html">Browse</a><a href="upload.html">Publish</a></nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="browse.js"></script>
</body>
</html>
