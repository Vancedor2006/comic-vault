<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - Comic-Vault</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101114">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- GitHub Pages shows this file for any missing address, including nested
       ones like /comic-vault/a/b, where relative links would break. So this
       page is self-contained and works out the site's root with JavaScript. -->
  <style>
    :root { color-scheme: dark; --bg: #101114; --text: #f5f2ea; --muted: #bdb9af; --border: #3a3b44; --shadow: #000; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { color-scheme: light; --bg: #f4f0e6; --text: #141414; --muted: #45413a; --border: #141414; --shadow: #141414; }
    }
    :root[data-theme="light"] { color-scheme: light; --bg: #f4f0e6; --text: #141414; --muted: #45413a; --border: #141414; --shadow: #141414; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; text-align: center;
      background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
    }
    svg { width: 72px; height: 72px; margin: 0 auto 1.25rem; display: block; }
    .code { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.15em; color: var(--muted); }
    h1 { font-family: Anton, Impact, "Arial Narrow", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0.015em; font-size: clamp(2.2rem, 6vw, 3.2rem); margin: 0.35rem 0 0.6rem; }
    p { color: var(--muted); max-width: 30rem; margin: 0 auto; }
    .actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.75rem; }
    a { display: inline-block; padding: 0.7rem 1.2rem; border-radius: 3px; font-weight: 700; text-decoration: none; border: 2px solid #141414; box-shadow: 3px 3px 0 var(--shadow); }
    .primary { background: #ffd400; color: #141414; }
    .secondary { border-color: var(--border); color: var(--text); }
    a:focus-visible { outline: 3px solid #1d3ccf; outline-offset: 2px; }
  </style>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("cv-theme"));
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-6 32 32)"><rect x="7" y="7" width="50" height="50" rx="6" fill="#ffd400" stroke="#141414" stroke-width="3"/><rect x="15" y="15" width="15" height="34" rx="2.5" fill="#141414"/><path d="M36.5 15h10a2.5 2.5 0 0 1 2.5 2.5v9.3L34 30.4V17.5a2.5 2.5 0 0 1 2.5-2.5z" fill="#141414"/><path d="M34 34.6l15-3.6v15.5a2.5 2.5 0 0 1-2.5 2.5h-10a2.5 2.5 0 0 1-2.5-2.5z" fill="#141414"/></g></svg>
    <p class="code">404</p>
    <h1>This page isn't in the vault</h1>
    <p>The link may be broken, or the page was moved or deleted.</p>
    <div class="actions">
      <a class="primary" href="index.html" data-site-link>Go to the home page</a>
      <a class="secondary" href="browse.html" data-site-link>Browse comics</a>
    </div>
  </main>
  <script>
    // On GitHub Pages project sites the site lives under /<repo>/
    (function () {
      var root = "/";
      if (/\.github\.io$/i.test(location.hostname)) {
        var first = location.pathname.split("/")[1];
        if (first) root = "/" + first + "/";
      }
      document.querySelectorAll("[data-site-link]").forEach(function (a) {
        a.href = root + a.getAttribute("href");
      });
    })();
  </script>
</body>
</html>
