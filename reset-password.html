<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password - Comic-Vault</title>
  <meta name="description" content="Reset your Comic-Vault password.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101114">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Comic-Vault">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="common.js"></script>

  <main id="main" class="auth-container" tabindex="-1">
    <div class="auth-card">

      <!-- Step 1: ask for the email address -->
      <form id="request-form" class="auth-form">
        <h1>Reset your password</h1>
        <p class="auth-subtitle">Enter your account's email and we'll send you a link to choose a new password.</p>
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input type="email" id="reset-email" class="input-field" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" id="request-btn" class="btn btn-full btn-large">Send reset link</button>
        <p id="request-message" class="auth-message" role="status"></p>
        <p class="auth-switch"><a href="login.html">Back to log in</a></p>
      </form>

      <!-- Step 2: after clicking the link in the email -->
      <form id="update-form" class="auth-form" hidden>
        <h1>Choose a new password</h1>
        <p class="auth-subtitle">Pick something at least 6 characters long.</p>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" class="input-field" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">Repeat new password</label>
          <input type="password" id="confirm-password" class="input-field" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" id="update-btn" class="btn btn-full btn-large">Save new password</button>
        <p id="update-message" class="auth-message" role="status"></p>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
