<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - ComicVault</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Supabase JS Client CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>
<body>

  <!-- Shared Header & Navigation Bar -->
  <header class="header">
    <div class="logo">ComicVault</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="upload.html">Upload</a>
      <a href="login.html" class="active">Login</a>
    </nav>
  </header>

  <main class="container auth-container">
    
    <div class="auth-card">
      
      <!-- Tab Controls to Toggle Between Login and Sign Up -->
      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Log In</button>
        <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- ============================================================ -->
      <!-- FORM 1: LOG IN                                              -->
      <!-- ============================================================ -->
      <!-- JS PLACEHOLDER: Phase 2 JS will capture submit and Phase 3 will authenticate with Supabase -->
      <form id="login-form" class="auth-form" onsubmit="event.preventDefault();">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Log in to manage your comics and save bookmarks.</p>

        <div class="form-group">
          <label for="login-email">Email Address *</label>
          <input type="email" id="login-email" class="input-field" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password *</label>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
        </div>

        <div class="form-row-between">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-full">Log In</button>
      </form>

      <!-- ============================================================ -->
      <!-- FORM 2: SIGN UP (Hidden by default)                         -->
      <!-- ============================================================ -->
      <form id="signup-form" class="auth-form hidden" onsubmit="event.preventDefault();">
        <h2>Create an Account</h2>
        <p class="auth-subtitle">Join ComicVault to upload series and bookmark chapters.</p>

        <div class="form-group">
          <label for="signup-username">Username / Creator Name *</label>
          <input type="text" id="signup-username" class="input-field" placeholder="e.g., AlexVance" required>
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="input-field" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password *</label>
          <input type="password" id="signup-password" class="input-field" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <button type="submit" id="signup-btn" class="btn btn-primary btn-full">Create Account</button>
      </form>

    </div>

  </main>

  <footer class="footer">
    <p>&copy; 2026 ComicVault. Built for webcomic creators and readers.</p>
  </footer>

  <!-- Basic inline tab switching helper until full login.js is built -->
  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
      } else {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
      }
    }
  </script>

  <!-- JS PLACEHOLDER: Un-comment when you create login.js in Phase 2 -->
  <!-- <script src="login.js"></script> -->
</body>
</html>
