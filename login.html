<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - ComicVault</title>
  <meta name="description" content="Log in to ComicVault to publish and manage your webcomics.">
  <meta name="theme-color" content="#101114">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ComicVault">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="common.js"></script>

  <main id="main" class="auth-container" tabindex="-1">
    <div class="auth-card">

      <nav class="auth-tabs" aria-label="Account">
        <a href="login.html" class="tab-btn active" data-auth-link aria-current="page">Log In</a>
        <a href="signup.html" class="tab-btn" data-auth-link>Sign Up</a>
      </nav>

      <form id="login-form" class="auth-form">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to publish and manage your comics.</p>

        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="auth-links-row"><a href="reset-password.html">Forgot password?</a></div>

        <button type="submit" id="login-btn" class="btn btn-full btn-large">Log In</button>
        <p id="login-message" class="auth-message" role="status"></p>
        <p class="auth-switch">Don't have an account? <a href="signup.html" data-auth-link>Sign up</a></p>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="login.js"></script>
</body>
</html>
