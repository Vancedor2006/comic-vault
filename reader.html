<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader - ComicVault</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="reader-body">

  <!-- ===== Shared header ===== -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo"><span class="logo-mark">CV</span>ComicVault</a>
      <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
      <nav class="site-nav" id="site-nav">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="browse.html">Browse</a></li>
          <li><a href="upload.html">Publish</a></li>
          <li><div id="nav-user-container"></div></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="reader-container" id="reader-root">

    <!-- Toolbar -->
    <section class="reader-toolbar">
      <div class="comic-title-info">
        <a href="browse.html" class="back-link" id="back-link">&larr; Back to series</a>
        <h1><a href="#" id="comic-title">Loading...</a></h1>
        <span class="chapter-subtitle" id="chapter-title">&nbsp;</span>
      </div>

      <div class="toolbar-controls">
        <label for="chapter-select" class="visually-hidden">Jump to chapter</label>
        <select id="chapter-select" class="select-field" disabled></select>
        <span id="creator-intent-badge" class="badge">Loading...</span>
      </div>
    </section>

    <p class="reader-tip hidden" id="reader-tip">
      Tip: use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or tap the sides of the page to turn pages.
    </p>

    <!-- Comic display -->
    <div id="reader-display" class="reader-display">
      <div class="reader-loading skeleton-block" id="reader-loading"></div>

      <!-- Vertical / webtoon mode -->
      <div id="infinite-wrapper" class="infinite-wrapper hidden"></div>

      <!-- Single-page mode (LTR / RTL) -->
      <div id="single-page-wrapper" class="single-page-wrapper hidden">
        <button type="button" id="prev-page-btn" class="page-nav-overlay prev-overlay" aria-label="Previous page">&lsaquo;</button>
        <img id="active-page-img" alt="" class="single-page">
        <button type="button" id="next-page-btn" class="page-nav-overlay next-overlay" aria-label="Next page">&rsaquo;</button>
      </div>
    </div>

    <div id="page-counter" class="page-counter hidden">
      Page <span id="current-page-num">1</span> of <span id="total-pages-num">1</span>
    </div>

    <!-- End-of-chapter panel -->
    <section id="chapter-end" class="chapter-end hidden">
      <h2>End of chapter</h2>
      <p id="chapter-end-text"></p>
      <div id="chapter-end-actions"></div>
    </section>

    <!-- Bottom nav -->
    <nav class="reader-bottom-nav" aria-label="Chapter navigation">
      <a id="prev-chapter-btn" class="btn btn-secondary" aria-disabled="true">&laquo; Prev chapter</a>
      <button type="button" id="scroll-top-btn" class="btn btn-ghost">Top &uarr;</button>
      <a id="next-chapter-btn" class="btn btn-primary" aria-disabled="true">Next chapter &raquo;</a>
    </nav>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-nav.js"></script>
  <script src="reader.js"></script>
</body>
</html>
